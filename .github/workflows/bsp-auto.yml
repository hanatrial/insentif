name: BSP auto upload

on:
  schedule:
    # 04.00-15.00 WITA (UTC+8) = 20.00-07.00 UTC, tiap 30 menit
    - cron: '*/30 20-23 * * *'
    - cron: '*/30 0-6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'bootstrap = login Microsoft pertama kali | run = normal | force = upload walau tanggal sama'
        default: 'run'
        type: choice
        options: [run, bootstrap, force]

concurrency:
  group: bsp-auto
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bsp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: automation/bsp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci --no-audit --no-fund

      - name: Pulihkan token Outlook (terenkripsi)
        uses: actions/cache/restore@v4
        with:
          path: automation/bsp/.token
          key: bsp-token-none
          restore-keys: bsp-token-

      - name: Ambil email dan upload BSP
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: node bsp.js "${{ github.event.inputs.mode || 'run' }}"

      - name: Simpan token Outlook yang diperbarui (terenkripsi)
        if: always() && hashFiles('automation/bsp/.token/rt.json') != ''
        uses: actions/cache/save@v4
        with:
          path: automation/bsp/.token
          key: bsp-token-${{ github.run_id }}-${{ github.run_attempt }}
