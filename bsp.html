<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Data BSP</title>
<style>
  :root{--bg:#F4F1E8;--card:#fff;--ink:#12261F;--mut:#6b7a73;--line:#e3ded0;--g1:#0B2B26;--g2:#235347;--lime:#B5D334;--ok:#1f9d63;--err:#c0392b}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:900px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:16px}
  h1{font-size:22px;margin:0;font-weight:800}
  .sub{font-size:13px;color:var(--mut);margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
  .drop{border:2px dashed var(--line);border-radius:16px;padding:32px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
  .drop.over{border-color:var(--g2);background:#f3f8f1}
  .drop b{display:block;font-size:16px;margin-bottom:4px}
  .drop span{font-size:13px;color:var(--mut)}
  input[type=file]{display:none}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  select,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:10px 14px;background:#fff;color:var(--ink)}
  button{cursor:pointer;font-weight:700}
  button.pri{background:var(--lime);border-color:var(--lime);color:var(--g1)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .nums{display:flex;gap:10px;flex-wrap:wrap}
  .nums div{background:#f7f5ee;border-radius:12px;padding:10px 14px}
  .nums b{display:block;font-size:20px}.nums span{font-size:12px;color:var(--mut)}
  .msg{font-size:14px}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
  .tw{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{position:sticky;top:0;background:var(--g1);color:#fff}
  .hide{display:none}
</style>
</head>
<body>
<main>
  <div>
    <h1>Input Data BSP</h1>
    <div class="sub">Unggah file BSP (Excel / CSV), cek pratinjau, lalu simpan ke Firestore. Hasilnya langsung muncul di Dashboard BSP.</div>
  </div>

  <div class="card" style="padding:12px 18px"><b>Terakhir upload:</b> <span id="last">memuat...</span></div>

  <div class="card">
    <label class="drop" id="drop" for="file">
      <b>Pilih file atau seret ke sini</b>
      <span>.xlsx, .xls, atau .csv</span>
    </label>
    <input type="file" id="file" accept=".xlsx,.xls,.csv">
    <p class="msg hide" id="msg"></p>
  </div>

  <div class="card hide" id="res">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="row">
        <span class="sub" id="fname"></span>
      </div>
      <div class="row">
        <button id="save" class="pri">Simpan ke Firestore</button>
      </div>
    </div>
    <div class="nums" style="margin-bottom:12px">
      <div><b id="nRows">0</b><span>baris akan disimpan</span></div>
      <div><b id="nCols">0</b><span>kolom</span></div>
      <div><b id="nSkip">0</b><span>baris dilewati (bukan Hilo/NS Tradisional)</span></div>
      <div><b id="nOld">–</b><span>baris tersimpan sekarang</span></div>
    </div>
    <div class="tw"><table id="tbl"></table></div>
    <div class="sub" id="more" style="margin-top:8px"></div>
  </div>
</main>

<script src="vendor/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  // Firebase & format data sama persis dengan dashboard (index.html) -> insentifData/BSP/chunks
  firebase.initializeApp({
    apiKey:"AIzaSyCA8Q8athqYIsY3By5wPxcU97GjDBR6DAs",
    authDomain:"mds-sulawesi.firebaseapp.com",
    projectId:"mds-sulawesi",
    storageBucket:"mds-sulawesi.firebasestorage.app",
    messagingSenderId:"511949021685",
    appId:"1:511949021685:web:bc32007af0555449e7c0bc"
  });
  var db=firebase.firestore(),BRANCH='BSP',CHUNK=1000,PREVIEW=100;
  var $=function(id){return document.getElementById(id)};
  var data=[],oldCount=null;

  function msg(t,c){var m=$('msg');m.textContent=t;m.className='msg '+(c||'');}
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

  function cleanName(raw){
    if(!raw)return raw;
    var m=String(raw).match(/\(([^)]+)\)\s*$/);
    return m?m[1].trim():String(raw).trim();
  }
  function slim(r){
    return {'Tgl':r['Tgl Faktur'],'Nomor Faktur':r['Nomor Faktur'],'Nama Toko':cleanName(r['Outlet']||r['Nama Customer']),
      'Nama Barang':r['Nama Barang'],'Sub Group Barang':r['Sub Group Barang'],'Salesman':r['Salesman'],'Netto':r['Netto']};
  }

  async function loadOld(){
    try{
      var s=await db.collection('insentifData').doc(BRANCH).get();
      oldCount=s.exists?(s.data().rowCount||0):0;
      $('nOld').textContent=oldCount;
      var ts=s.exists?s.data().updatedAt:null;
      $('last').textContent=ts?ts.toDate().toLocaleString('id-ID',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})+' WIB ('+oldCount+' baris)':'Belum ada upload';
    }catch(e){$('nOld').textContent='?';$('last').textContent='gagal memuat';}
  }

  function handle(f){
    if(!f)return;
    if(!/\.(xlsx|xls|csv)$/i.test(f.name)){msg('Format tidak didukung. Pakai .xlsx, .xls, atau .csv.','err');return;}
    var rd=new FileReader();
    rd.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var all=XLSX.utils.sheet_to_json(ws,{defval:null,range:2});
        data=all.filter(function(r){
          var sg=String(r['Sub Group Barang']||'').trim().toUpperCase();
          return sg==='HILO TRADISIONAL'||sg==='NS TRADITIONAL';
        }).map(slim);
        $('fname').textContent=f.name;
        $('nRows').textContent=data.length;
        $('nSkip').textContent=all.length-data.length;
        var cols=data.length?Object.keys(data[0]):['Tgl','Nomor Faktur','Nama Toko','Nama Barang','Sub Group Barang','Salesman','Netto'];
        $('tbl').innerHTML='<thead><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+
          data.slice(0,PREVIEW).map(function(r){return '<tr>'+cols.map(function(c){
            var v=r[c];if(v instanceof Date)v=v.toLocaleDateString('id-ID');return '<td>'+esc(v)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody>';
        $('more').textContent=data.length>PREVIEW?('Menampilkan '+PREVIEW+' dari '+data.length+' baris.'):'';
        $('save').disabled=!data.length;
        $('res').classList.remove('hide');
        loadOld();
        if(data.length)msg('Terbaca '+data.length+' baris tradisional dari '+all.length+' baris. Cek pratinjau, lalu klik Simpan.','ok');
        else msg('Tidak ada baris Hilo Tradisional / NS Traditional. Cek file dan kolom "Sub Group Barang" (header harus di baris ke-3).','err');
      }catch(err){msg('Gagal membaca file: '+err.message,'err');}
    };
    rd.onerror=function(){msg('Gagal membuka file.','err');};
    rd.readAsArrayBuffer(f);
  }

  async function save(){
    if(!data.length)return;
    if(!confirm('Data BSP di Firestore ('+(oldCount==null?'?':oldCount)+' baris) akan DITIMPA dengan '+data.length+' baris dari file ini. Lanjut?'))return;
    $('save').disabled=true;
    try{
      var col=db.collection('insentifData').doc(BRANCH).collection('chunks'),chunks=[];
      for(var i=0;i<data.length;i+=CHUNK)chunks.push(data.slice(i,i+CHUNK));
      for(var k=0;k<chunks.length;k++){
        msg('Mengunggah '+(k+1)+' / '+chunks.length+'...','');
        await col.doc(String(k).padStart(5,'0')).set({rows:chunks[k],updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      }
      var ex=await col.get(),b=db.batch(),n=0;
      for(var d of ex.docs){var ix=parseInt(d.id,10);if(!isNaN(ix)&&ix<chunks.length)continue;b.delete(d.ref);n++;}
      if(n)await b.commit();
      await db.collection('insentifData').doc(BRANCH).set({chunkCount:chunks.length,rowCount:data.length,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      msg('Tersimpan di Firestore: '+data.length+' baris. Buka Dashboard BSP untuk melihat hasilnya.','ok');
      loadOld();
    }catch(err){msg('GAGAL simpan: '+err.message,'err');}
    $('save').disabled=false;
  }

  $('file').addEventListener('change',function(e){handle(e.target.files[0]);e.target.value='';});
  $('save').addEventListener('click',save);
  loadOld();
  var d=$('drop');
  ['dragenter','dragover'].forEach(function(t){d.addEventListener(t,function(e){e.preventDefault();d.classList.add('over')})});
  ['dragleave','drop'].forEach(function(t){d.addEventListener(t,function(e){e.preventDefault();d.classList.remove('over')})});
  d.addEventListener('drop',function(e){handle(e.dataTransfer.files[0]);});
})();
</script>
</body>
</html>
