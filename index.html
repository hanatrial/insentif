const CLOUD_CHUNK_SIZE = 1000;

async function saveDataToCloud(branch, data){
  // Tulis tiap chunk SATU PER SATU (bukan batch) -- tiap chunk bisa ~500KB, kalau
  // digabung banyak sekaligus dalam satu batch commit bisa melebihi limit ukuran
  // request Firestore. Chunk ditimpa langsung di ID final: kalau prosesnya gagal
  // di tengah jalan, chunk yang belum sempat ditimpa tetap berisi data lama
  // (tidak pernah kosong), bukan data yang hilang total.
  const colRef = db.collection('insentifData').doc(branch).collection('chunks');

  const chunks = [];
  for(let i = 0; i < data.length; i += CLOUD_CHUNK_SIZE){ chunks.push(data.slice(i, i + CLOUD_CHUNK_SIZE)); }

  for(let idx = 0; idx < chunks.length; idx++){
    const ref = colRef.doc(String(idx).padStart(5, '0'));
    await ref.set({ rows: chunks[idx], updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  }

  // Hapus sisa chunk lama yang tidak lagi terpakai (kalau data baru lebih sedikit chunk-nya)
  const existing = await colRef.get();
  let batch = db.batch();
  let opCount = 0;
  for(const doc of existing.docs){
    const idx = parseInt(doc.id, 10);
    if(!isNaN(idx) && idx < chunks.length) continue;
    batch.delete(doc.ref);
    opCount++;
    if(opCount >= 450){ await batch.commit(); batch = db.batch(); opCount = 0; }
  }
  if(opCount > 0){ await batch.commit(); }

  await db.collection('insentifData').doc(branch).set({
    chunkCount: chunks.length,
    rowCount: data.length,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

async function loadDataFromCloud(branch){
  const colRef = db.collection('insentifData').doc(branch).collection('chunks');
  const snap = await colRef.orderBy(firebase.firestore.FieldPath.documentId()).get();
  let all = [];
  snap.forEach(doc=>{ all = all.concat(doc.data().rows || []); });
  return all;
}

const YEAR = 2026;
const MONTHS_ID = ['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];
function periodRange(periodeStr){
  const parts = periodeStr.split('-').map(s=>s.trim().toLowerCase());
  const startMonth = MONTHS_ID.indexOf(parts[0]) + 1;
  const endMonth = parts[1] ? (MONTHS_ID.indexOf(parts[1]) + 1) : startMonth;
  const start = new Date(YEAR, startMonth - 1, 1);
  const end = new Date(YEAR, endMonth, 0, 23, 59, 59);
  return [start, end];
}
function toDate(tgl){
  if(tgl instanceof Date) return tgl;
  if(tgl && typeof tgl.toDate === 'function') return tgl.toDate(); // Firestore Timestamp
  if(typeof tgl === 'string'){
    const d = new Date(tgl.replace(' ', 'T'));
    if(!isNaN(d.getTime())) return d;
  }
  if(typeof tgl === 'number'){
    // Excel serial date fallback
    const d = new Date(Date.UTC(1899, 11, 30) + tgl * 86400000);
    if(!isNaN(d.getTime())) return d;
  }
  return null;
}
function inPeriod(tgl, range){
  const d = toDate(tgl);
  if(!d) return false;
  return d >= range[0] && d <= range[1];
}

let rawData = [];

const SALES_ALIAS = {
  "MISWAR JAMIL": "KAMELIA (NFI)",
  "ST DEWI PUSPITA SARI": "KAMELIA (NFI)",
  "KAMELIA": "KAMELIA (NFI)",
  "SALDI RENALDI": "HABRIYANTO",
  "IDUL KIHAJAR B": "HABRIYANTO",
  "MOHAMAD SUGIARTO PONTOH": "MUHAMMAD SUGIARTO",
  "ULAN DJAFAR": "MOHAMAD FEBRIYANTO HAMID"
};
function normSales(name){
  if(!name) return name;
  const trimmed = String(name).trim();
  return SALES_ALIAS[trimmed] || trimmed;
}

function field(r, ...keys){
  for(const k of keys){
    if(r[k] !== undefined && r[k] !== null) return r[k];
  }
  return null;
}

function slimRow(r){
  return {
    'Tgl': field(r, 'Tgl'),
    'Ship To': field(r, 'Ship To', 'ShipTo'),
    'Perusahaan': field(r, 'Perusahaan'),
    'Nama Barang': field(r, 'Nama Barang', 'NamaBarang'),
    'Merek': field(r, 'Merek'),
    'Group1Barang': field(r, 'Group 1Barang', 'Group1Barang'),
    'Nama Sales': field(r, 'Nama Sales', 'NamaSales'),
    'Bonus': field(r, 'Bonus')
  };
}
function inOktNov(r){
  return inPeriod(field(r, 'Tgl'), periodRange(OKTOBER_PERIODE));
}
function isBonusRow(r){
  const b = field(r, 'Bonus');
  if(b === 1 || b === '1' || b === true) return true;
  const barang = String(field(r, 'Nama Barang', 'NamaBarang') || '').trim().toUpperCase();
  if(barang.startsWith('B-')) return true;
  return false;
}

function processFile(){
  const f = document.getElementById('fileInput').files[0];
  if(!f){ document.getElementById('status').textContent = 'Pilih file dulu.'; return; }
  const reader = new FileReader();
  setStatus('⏳ Membaca file...', 'pending');
  reader.onerror = function(){
    setStatus(`❌ GAGAL MEMBACA FILE: ${reader.error ? reader.error.message : 'tidak diketahui'}`, 'error');
  };
  reader.onload = async function(e){
    await new Promise(resolve => setTimeout(resolve, 0)); // biar status "Membaca file..." kelihatan sebelum parsing berat
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const allRows = XLSX.utils.sheet_to_json(ws, {defval:null}).map(slimRow);
      const okt = allRows.filter(inOktNov);
      if(!okt.length){
        setStatus(`❌ Tidak ada baris bertanggal Oktober-November ${YEAR} dari ${allRows.length} baris di file. Data cloud TIDAK diganti. Cek kolom Tgl dan periode file.`, 'error');
        return;
      }
      rawData = okt;
    }catch(parseErr){
      setStatus(`❌ GAGAL MEMBACA/PARSING FILE: ${parseErr.message}`, 'error');
      return;
    }
    setStatus(`⏳ Terbaca ${rawData.length} baris. Mengunggah ke cloud (mengganti data lama)...`, 'pending');
    let saveError = null;
    try{
      await saveDataToCloud(currentUser, rawData);
    }catch(err){
      saveError = err;
    }
    compute();
    if(saveError){
      setStatus(`❌ GAGAL SIMPAN KE CLOUD: ${saveError.message}. Data cuma ada di layar ini, akan hilang saat refresh!`, 'error');
    } else {
      setStatus(`✅ TERSIMPAN DI CLOUD — data ${currentUser} sudah diganti (${rawData.length} baris).`, 'ok');
    }
  };
  reader.readAsArrayBuffer(f);
}

function setStatus(text, kind){
  const el = document.getElementById('status');
  el.textContent = text;
  el.classList.remove('ok','error','pending');
  if(kind) el.classList.add(kind);
}

async function loadUserFromCloud(user){
  setStatus(`⏳ Memuat data ${user} dari cloud...`, 'pending');
  try{
    rawData = (await loadDataFromCloud(user)).filter(inOktNov);
    if(rawData.length){
      compute();
      setStatus(`✅ Dimuat ${rawData.length} baris Oktober-November dari cloud untuk ${user}.`, 'ok');
    } else {
      compute();
      setStatus(`⚠️ Belum ada data Oktober-November di cloud untuk ${user}. Upload file untuk mengisi.`, 'error');
    }
  }catch(err){
    compute();
    setStatus(`❌ GAGAL memuat data cloud: ${err.message}`, 'error');
  }
}

function compute(){
  if(currentBranch === 'TargetCabang'){ computeTargetCabang(); return; }
  computeOktober();

function pct(ach, target){
  if(!target) return 0;
  return Math.round((ach/target)*100);
}

function parseInsentifAmount(str){
  if(!str) return 0;
  const m = String(str).match(/[\d.,]+/);
  if(!m) return 0;
  return parseInt(m[0].replace(/[.,]/g, ''), 10) || 0;
}

function calcOktoberResults(branch){
  const salesList = OKTOBER_SALES[branch];
  const rOkt = periodRange('Oktober');
  const rNov = periodRange('November');
  const sets = {};
  const setKeys = ['okEaHilo','okEaHiloOkt','okSwiss','okSwissOkt','okSchool','okSchoolOkt','okTea','okTeaOkt','okSchoolCok','okSchoolVan','okTeen'];
  setKeys.forEach(k=>sets[k] = {});
  const ns7All = {};
  const ns7Okt = {};
  const addTo = (map, sales, key)=>{ (map[sales] = map[sales] || new Set()).add(key); };
  const addVarian = (map, sales, toko, varian)=>{
    if(!map[sales]) map[sales] = {};
    if(!map[sales][toko]) map[sales][toko] = new Set();
    map[sales][toko].add(varian);
  };

  rawData.forEach(r=>{
    const sales = normSales(field(r, 'Nama Sales', 'NamaSales'));
    if(!salesList.includes(sales)) return;
    const barang = field(r, 'Nama Barang', 'NamaBarang');
    if(!barang) return;
    const d = toDate(field(r, 'Tgl'));
    if(!d) return;
    const inOkt = d >= rOkt[0] && d <= rOkt[1];
    const inNov = d >= rNov[0] && d <= rNov[1];
    if(!inOkt && !inNov) return;
    const toko = String(field(r, 'Ship To', 'ShipTo') || field(r, 'Perusahaan'));
    const merek = field(r, 'Merek');
    const isTrad =String(field(r, 'Group 1Barang', 'Group1Barang') || '').trim().toUpperCase() === 'TRADITIONAL';
    const n = String(barang).toUpperCase();

    if(isTrad && !isBonusRow(r) && (n.includes('HILO') || n.includes('HI LO'))){
      addTo(sets.okEaHilo, sales, (inOkt ? 'O|' : 'N|') + toko);
      if(inOkt) addTo(sets.okEaHiloOkt, sales, toko);
    }
    if(isSwiss(barang)){ addTo(sets.okSwiss, sales, toko); if(inOkt) addTo(sets.okSwissOkt, sales, toko); }
    if(isSchool(barang, isTrad ? 'TRADITIONAL' : '')){ addTo(sets.okSchool, sales, toko); if(inOkt) addTo(sets.okSchoolOkt, sales, toko); }
    if(isTea(barang, merek)){ addTo(sets.okTea, sales, toko); if(inOkt) addTo(sets.okTeaOkt, sales, toko); }
    if(n.includes('HILO SCHOOL COKELAT SUSU PLS')) addTo(sets.okSchoolCok, sales, toko);
    if(n.includes('HILO SCHOOL VANILLA SUSU PLS')) addTo(sets.okSchoolVan, sales, toko);
    if(n.includes('HILO 3IN1 COKLAT BELGIA PLS') || n.includes('HILO ACT BELGIAN CHOCOLATE PLS')) addTo(sets.okTeen, sales, toko);

    if(merek === 'NUTRISARI' && isTrad){
      const varian = itemGroupKompetisi(barang, branch);
      if(varian){
        addVarian(ns7All, sales, toko, varian);
        if(inOkt) addVarian(ns7Okt, sales, toko, varian);
      }
    }
  });

  const results = {};
  setKeys.forEach(k=>{
    results[k] = {};
    salesList.forEach(s=>{ results[k][s] = sets[k][s] ? sets[k][s].size : 0; });
  });
  const countNs7 = map=>{
    const res = {};
    salesList.forEach(s=>{
      res[s] = Object.values(map[s] || {}).filter(v=>v.size >= OKTOBER_NS7_THRESHOLD).length;
    });
    return res;
  };
  results.okNs7 = countNs7(ns7All);
  results.okNs7Okt = countNs7(ns7Okt);
  return results;
}

function computeOktober(){
  renderOktober(calcOktoberResults(currentBranch));
  document.getElementById('status').textContent = `Selesai menghitung dari ${rawData.length} baris data.`;
}

function computeTargetCabang(){
  const cfg = OKTOBER_TARGET_CABANG.Makassar;
  const sum = {}; targetCabangRows(cfg).forEach(k=>sum[k.id] = 0);
  let jmlSales = 0;
  cfg.branches.forEach(b=>{
    const res = rawData.length ? calcOktoberResults(b) : null;
    jmlSales += OKTOBER_SALES[b].length;
    if(res) targetCabangRows(cfg).forEach(k=>{
      if(k.branches && !k.branches.includes(b)) return;
      OKTOBER_SALES[b].forEach(s=>{ sum[k.id] += (res[k.id] && res[k.id][s]) || 0; });
    });
  });
  renderTargetCabang(cfg, sum, jmlSales);
  document.getElementById('status').textContent = rawData.length ? `Selesai menghitung dari ${rawData.length} baris data.` : '';
}

function targetCabangRows(cfg){
  return OKTOBER_KPI.concat(OKTOBER_VARIAN.filter(v=>cfg[v.id] !== undefined));
}

function renderTargetCabang(cfg, sum, jmlSales){
  const table = document.getElementById('mainTable');
  table.innerHTML = '<caption>Target Cabang Oktober - November (Makassar + Bulukumba)</caption>';
  delete table.dataset.splitRow;
  const thead = table.insertRow(-1);
  thead.innerHTML = '<th>Distributor / Cabang</th><th>Program Insentif</th><th>KPI</th><th>Target Cabang</th><th>Ach Cabang</th><th>%Ach</th>';
  const rowsCfg = targetCabangRows(cfg);
  const groups = [
    { label:'Insentif Raport Sales Q4 2026', items:OKTOBER_KPI.map(k=>({ id:k.id, name:k.title })) },
    { label:'Insentif Hilo School PLS', items:[{ id:'okSchoolCok', name:'Coklat' }, { id:'okSchoolVan', name:'Vanilla' }] },
    { label:'Insentif Hilo Teen (3in1) PLS', items:[{ id:'okTeen', name:'3in1 Coklat Belgia / ACT Belgian' }] }
  ].map(g=>({ label:g.label, items:g.items.filter(it=>cfg[it.id] !== undefined) })).filter(g=>g.items.length);
  let first = true;
  groups.forEach(g=>{
    g.items.forEach((it, i)=>{
      const target = cfg[it.id];
      const ach = sum[it.id] || 0;
      const p_ = pct(ach, target);
      const width = Math.max(0, Math.min(p_, 100));
      const row = table.insertRow(-1);
      let html = '';
      if(first){
        html += `<td class="program" rowspan="${rowsCfg.length}">${cfg.label}</td>`;
        first = false;
      }
      if(i === 0) html += `<td class="program" rowspan="${g.items.length}">${g.label}</td>`;
      html += `<td class="nama">${it.name}</td>`;
      html += `<td>${target}</td>`;
      html += `<td>${ach}</td>`;
      html += `<td class="bar-cell"><div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${width}%"></div></div><span class="bar-label">${p_}%</span></div></td>`;
      row.innerHTML = html;
    });
  });
}

function renderOktober(results){
  const salesList = getSalesList();
  const table = document.getElementById('mainTable');
  table.innerHTML = '<caption>Program Insentif Oktober - November</caption>';
  const get = (id, s)=> (results[id] && results[id][s]) || 0;
  const header = '<th>Program Insentif</th><th>Periode</th><th>Nama Salesman</th><th>Insentif</th><th>Target</th><th>Ach</th><th>%Ach</th>';

  const cabangCfg = currentBranch === 'Gorontalo' ? OKTOBER_TARGET_CABANG.Gorontalo : null;
  const renderBlock = (p, insentifText, withCabang)=>{
    const rs = salesList.length + (withCabang ? 1 : 0);
    const thead = table.insertRow(-1);
    thead.innerHTML = header;
    salesList.forEach((sales, idx)=>{
      const ach = get(p.id, sales);
      const p_ = pct(ach, p.target);
      const width = Math.max(0, Math.min(p_, 100));
      const row = table.insertRow(-1);
      let html = '';
      if(idx === 0){
        html += `<td class="program" rowspan="${rs}">${p.title}</td>`;
        html += `<td rowspan="${rs}">${p.periode}</td>`;
      }
      html += `<td class="nama">${sales}</td>`;
      if(idx === 0) html += `<td rowspan="${rs}">${insentifText}</td>`;
      html += `<td><input class="target-input" type="number" value="${p.target}" onchange="updateTarget('${p.id}', this.value)"></td>`;
      html += `<td>${ach}</td>`;
      html += `<td class="bar-cell"><div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${width}%"></div></div><span class="bar-label">${p_}%</span></div></td>`;
      row.innerHTML = html;
    });
    if(withCabang){
      const total = salesList.reduce((acc, s)=>acc + get(p.id, s), 0);
      const target = cabangCfg[p.id];
      const p_ = pct(total, target);
      const width = Math.max(0, Math.min(p_, 100));
      const row = table.insertRow(-1);
      row.style.background = '#eef3ea';
      row.innerHTML = `<td class="nama" style="color:#000;">TOTAL CABANG</td><td style="font-weight:bold;">${target}</td><td style="font-weight:bold;">${total}</td><td class="bar-cell"><div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${width}%"></div></div><span class="bar-label">${p_}%</span></div></td>`;
    }
  };

  OKTOBER_KPI.forEach(p=>renderBlock(p, 'Masuk Raport Sales', !!cabangCfg));

  const raport = {};
  salesList.forEach(s=>{
    const achCount = OKTOBER_KPI.filter(k=>k.target > 0 && get(k.id, s) >= k.target).length;
    let nominal = OKTOBER_RAPORT_TIERS[achCount] || 0;
    const allBonus = achCount === OKTOBER_KPI.length && get('okEaHilo', s) > OKTOBER_EA_HILO_BONUS_MIN;
    if(allBonus) nominal = OKTOBER_RAPORT_BONUS_ALL;
    const okt60 = OKTOBER_KPI.filter(k=>k.target > 0 && get(k.id + 'Okt', s) >= 0.6 * k.target).length;
    const bonusOkt = okt60 >= 3 ? OKTOBER_BONUS_OKT : 0;
    raport[s] = { achCount, nominal, allBonus, okt60, bonusOkt };
  });

  const theadR = table.insertRow(-1);
  theadR.innerHTML = '<th>Program Insentif</th><th>Periode</th><th>Nama Salesman</th><th>KPI Tercapai (dari 5)</th><th>Insentif Raport 2 Bulan</th><th>KPI >=60% di Oktober</th><th>Bonus Oktober</th>';
  salesList.forEach((sales, idx)=>{
    const rp = raport[sales];
    const row = table.insertRow(-1);
    let html = '';
    if(idx === 0){
      html += `<td class="program" rowspan="${salesList.length}">Insentif Raport Sales Q4 2026</td>`;
      html += `<td rowspan="${salesList.length}">${OKTOBER_PERIODE}</td>`;
    }
    html += `<td class="nama">${sales}</td>`;
    html += `<td>${rp.achCount}${rp.allBonus ? ' (EA Hilo >' + OKTOBER_EA_HILO_BONUS_MIN + ')' : ''}</td>`;
    html += `<td style="font-weight:bold;">Rp ${rp.nominal.toLocaleString('id-ID')}</td>`;
    html += `<td>${rp.okt60}</td>`;
    html += `<td style="font-weight:bold;">Rp ${rp.bonusOkt.toLocaleString('id-ID')}</td>`;
    row.innerHTML = html;
  });

  table.dataset.splitRow = table.rows.length;
  const varianAktif = OKTOBER_VARIAN.filter(p=>p.branches.includes(currentBranch));
  varianAktif.forEach(p=>renderBlock(p, 'Rp ' + p.insentif + '/varian', !!(cabangCfg && cabangCfg[p.id])));

  const totals = {};
  salesList.forEach(s=>{
    totals[s] = raport[s].bonusOkt;
  });

  const theadTotal = table.insertRow(-1);
  theadTotal.innerHTML = '<th colspan="2">Ringkasan</th><th>Nama Salesman</th><th colspan="4">Total Insentif</th>';
  salesList.forEach((sales, idx)=>{
    const row = table.insertRow(-1);
    let html = '';
    if(idx === 0){
      html += `<td class="program" rowspan="${salesList.length}" colspan="2">Total Insentif Oktober per Salesman (hanya Bonus Oktober)</td>`;
    }
    html += `<td class="nama">${sales}</td>`;
    html += `<td colspan="4" style="text-align:right; font-weight:bold;">Rp ${totals[sales].toLocaleString('id-ID')}</td>`;
    row.innerHTML = html;
  });
}

function updateTarget(id, val){
  const p = OKTOBER_KPI.find(p=>p.id===id) || OKTOBER_VARIAN.find(p=>p.id===id);
  if(p){
    const num = parseInt(val) || 0;
    if(p.targetByBranch && p.targetByBranch[currentBranch] !== undefined){
      p.targetByBranch[currentBranch] = num;
    } else {
      p.target = num;
    }
  }
  if(rawData.length) compute();
}

async function exportTableImages(){
  if(typeof html2canvas !== 'function'){ alert('Library gambar belum termuat, coba refresh halaman.'); return; }
  const original = currentBranch;
  const branches = [original];
  setStatus('⏳ Membuat gambar...', 'pending');
  let total = 0;
  let errMsg = null;
  try{
    for(const b of branches){
      if(b !== currentBranch) switchBranch(b);
      total += await exportOneTableImages();
    }
  }catch(err){
    errMsg = err.message;
  }
  if(currentBranch !== original) switchBranch(original);
  if(errMsg) setStatus(`❌ Gagal export gambar: ${errMsg}`, 'error');
  else setStatus(`✅ ${total} gambar berhasil diexport (${branches.join(', ')}).`, 'ok');
}

async function exportOneTableImages(){
  const table = document.getElementById('mainTable');
  const allRows = Array.from(table.rows);
  if(allRows.length < 2) return 0;
  const headerIdx = allRows.map((r, i)=> (r.cells[0] && r.cells[0].tagName === 'TH') ? i : -1).filter(i=>i > 0);
  const half = allRows.length / 2;
  let split = allRows.length;
  if(headerIdx.length){
    split = headerIdx.reduce((best, i)=> Math.abs(i - half) < Math.abs(best - half) ? i : best, headerIdx[0]);
  }
  if(table.dataset.splitRow){
    split = parseInt(table.dataset.splitRow, 10);
  }
  const caption = table.caption ? table.caption.textContent : 'Insentif';
  const parts = [allRows.slice(0, split), allRows.slice(split)].filter(p=>p.length);
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;padding:12px;width:' + Math.max(table.offsetWidth, 900) + 'px;';
  document.body.appendChild(wrap);
  try{
    for(let i = 0; i < parts.length; i++){
      wrap.innerHTML = '';
      const t = document.createElement('table');
      const cap = document.createElement('caption');
      cap.textContent = `${caption} (${currentBranch}) - Bagian ${i + 1}/${parts.length}`;
      t.appendChild(cap);
      parts[i].forEach(r=>t.appendChild(r.cloneNode(true)));
      wrap.appendChild(t);
      const canvas = await html2canvas(wrap, { backgroundColor:'#ffffff', scale:2 });
      await new Promise(res=>canvas.toBlob(blob=>{
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Insentif_${currentBranch}_${caption.replace(/[^A-Za-z0-9]+/g, '_')}_${i + 1}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
        res();
      }));
      await new Promise(r=>setTimeout(r, 400));
    }
    return parts.length;
  }finally{
    wrap.remove();
  }
}

function exportToExcel(){
  if(!rawData.length){
    alert('Belum ada data untuk diexport. Pilih cabang yang datanya sudah ada, atau upload file dulu.');
    return;
  }
  const exportRows = rawData.map(r=>{
    const d = toDate(r['Tgl']);
    return Object.assign({}, r, { 'Tgl': d || r['Tgl'] });
  });
  const ws = XLSX.utils.json_to_sheet(exportRows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data Mentah');
  const tanggal = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Data_Insentif_${currentUser || currentBranch}_${tanggal}.xlsx`);
}
