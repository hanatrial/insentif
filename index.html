const CLOUD_CHUNK_SIZE = 1000;

async function saveDataToCloud(branch, data){
  const colRef = db.collection('insentifData').doc(branch).collection('chunks');

  const existing = await colRef.get();
  let batch = db.batch();
  let opCount = 0;
  for(const doc of existing.docs){
    batch.delete(doc.ref);
    opCount++;
    if(opCount >= 450){ await batch.commit(); batch = db.batch(); opCount = 0; }
  }
  if(opCount > 0){ await batch.commit(); }

  const chunks = [];
  for(let i = 0; i < data.length; i += CLOUD_CHUNK_SIZE){ chunks.push(data.slice(i, i + CLOUD_CHUNK_SIZE)); }

  batch = db.batch();
  opCount = 0;
  for(let idx = 0; idx < chunks.length; idx++){
    const ref = colRef.doc(String(idx).padStart(5, '0'));
    batch.set(ref, { rows: chunks[idx], updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    opCount++;
    if(opCount >= 450){ await batch.commit(); batch = db.batch(); opCount = 0; }
  }
  if(opCount > 0){ await batch.commit(); }

  await db.collection('insentifData').doc(branch).set({
    chunkCount: chunks.length,
    rowCount: data.length,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

async function loadDataFromCloud(branch){
  const colRef = db.collection('insentifData').doc(branch).collection('chunks');
  const snap = await colRef.orderBy(firebase.firestore.FieldPath.documentId()).get();
  let all = [];
  snap.forEach(doc=>{ all = all.concat(doc.data().rows || []); });
  return all;
}

const YEAR = 2026;
const MONTHS_ID = ['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];
function periodRange(periodeStr){
  const parts = periodeStr.split('-').map(s=>s.trim().toLowerCase());
  const startMonth = MONTHS_ID.indexOf(parts[0]) + 1;
  const endMonth = parts[1] ? (MONTHS_ID.indexOf(parts[1]) + 1) : startMonth;
  const start = new Date(YEAR, startMonth - 1, 1);
  const end = new Date(YEAR, endMonth, 0, 23, 59, 59);
  return [start, end];
}
function toDate(tgl){
  if(tgl instanceof Date) return tgl;
  if(tgl && typeof tgl.toDate === 'function') return tgl.toDate(); // Firestore Timestamp
  if(typeof tgl === 'string'){
    const d = new Date(tgl.replace(' ', 'T'));
    if(!isNaN(d.getTime())) return d;
  }
  if(typeof tgl === 'number'){
    // Excel serial date fallback
    const d = new Date(Date.UTC(1899, 11, 30) + tgl * 86400000);
    if(!isNaN(d.getTime())) return d;
  }
  return null;
}
function inPeriod(tgl, range){
  const d = toDate(tgl);
  if(!d) return false;
  return d >= range[0] && d <= range[1];
}

function resolveAgustusSales(rawName, tgl){
  const sales = normSales(rawName);

  if(d){
    const cutoffStart = new Date(2026, 7, 1);
    const cutoffEnd = new Date(2026, 7, 5, 23, 59, 59);

function processFile(){
  const f = document.getElementById('fileInput').files[0];
  if(!f){ document.getElementById('status').textContent = 'Pilih file dulu.'; return; }
  const reader = new FileReader();
  reader.onload = async function(e){
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data, {type:'array', cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];
    rawData = XLSX.utils.sheet_to_json(ws, {defval:null}).map(slimRow);
    setStatus(`⏳ Terbaca ${rawData.length} baris. Mengunggah ke cloud (mengganti data lama)...`, 'pending');
    try{
      await saveDataToCloud(currentUser, rawData);
      setStatus(`✅ TERSIMPAN DI CLOUD — data ${currentUser} sudah diganti (${rawData.length} baris).`, 'ok');
    }catch(err){
      setStatus(`❌ GAGAL SIMPAN KE CLOUD: ${err.message}. Data cuma ada di layar ini, akan hilang saat refresh!`, 'error');
    }
    compute();
  };
  reader.readAsArrayBuffer(f);
}

function setStatus(text, kind){
  const el = document.getElementById('status');
  el.textContent = text;
  el.classList.remove('ok','error','pending');
  if(kind) el.classList.add(kind);
}

      setStatus(`✅ Dimuat ${rawData.length} baris dari cloud untuk ${user}.`, 'ok');

let dashSortCol = null;
let dashSortAsc = true;

function sortCellValue(cell){
  if(!cell) return '';
  const text = cell.textContent.trim();
  if(text.startsWith('Rp')){
    const num = parseFloat(text.replace(/[^0-9-]/g, '')) || 0;
    return num;
  }
  return text.toUpperCase();
}

function sortDashboardTable(colIndex){
  if(dashSortCol === colIndex){ dashSortAsc = !dashSortAsc; } else { dashSortCol = colIndex; dashSortAsc = true; }
  const table = document.getElementById('dashboardTable');
  const rows = Array.from(table.rows);
  let i = 0;
  while(i < rows.length){
    if(rows[i].dataset.pct !== undefined){
      let j = i;
      while(j < rows.length && rows[j].dataset.pct !== undefined) j++;
      const block = rows.slice(i, j);
      block.sort((a, b)=>{
        const va = sortCellValue(a.cells[colIndex]);
        const vb = sortCellValue(b.cells[colIndex]);
        let cmp;
        if(typeof va === 'number' && typeof vb === 'number'){ cmp = va - vb; }
        else { cmp = String(va).localeCompare(String(vb)); }
        return dashSortAsc ? cmp : -cmp;
      });
      block.forEach(r=> table.appendChild(r));
      i = j;
    } else {
      i++;
    }
  }
}

const NAME_STOPWORDS = new Set(['TK','TOKO','MM','PT','CV','MART','UD','TP','GROSIR','SWALAYAN','KIOS','STAND']);

function normWords(s, dropStopwords){
  const words = String(s || '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(w=>w.length > 0);
  return dropStopwords ? words.filter(w=>!NAME_STOPWORDS.has(w)) : words;
}

function wordsSubsetMatch(a, b){
  let wa = new Set(normWords(a, true));
  let wb = new Set(normWords(b, true));
  if(!wa.size) wa = new Set(normWords(a, false));
  if(!wb.size) wb = new Set(normWords(b, false));
  if(!wa.size || !wb.size) return false;
  const smaller = wa.size <= wb.size ? wa : wb;
  const larger = wa.size <= wb.size ? wb : wa;
  if(smaller.size / larger.size < 0.6) return false;
  let matchCount = 0;
  smaller.forEach(w=>{ if(larger.has(w)) matchCount++; });
  return matchCount === smaller.size;
}

function findBSPMatchingStore(stores, targetNama){
  for(const key of Object.keys(stores)){
    if(wordsSubsetMatch(stores[key].nama, targetNama)) return { key, store: stores[key] };
  }
  return null;
}

function findOfficialSalesman(targetNama){
  for(const entry of STORE_SALESMAN_MAP){
    if(wordsSubsetMatch(entry.nama, targetNama)) return entry.sales;
  }

}

function buildStoreStats(cloudRows, filterFn){
  const stores = {};
  cloudRows.forEach(r=>{
    const barang = field(r, 'Nama Barang', 'NamaBarang');
    if(!barang) return;
    if(filterFn && !filterFn(r)) return;
    const shipTo = field(r, 'Ship To', 'ShipTo');
    const perusahaan = field(r, 'Perusahaan');
    const namaToko = perusahaan || shipTo || '(tanpa nama)';
    const tokoKey = shipTo || perusahaan;
    const group1 = String(field(r, 'Group1Barang') || '').trim().toUpperCase();
    const nominal = parseFloat(field(r, 'DPP')) || 0;
    if(!stores[tokoKey]){
      stores[tokoKey] = { nama: namaToko, omzetTradisional:0, omzetNonTradisional:0, itemsTradisional:{}, itemsModern:{}, salesNames:new Set() };
    }
    const s = stores[tokoKey];
    const bucket = (group1 === 'TRADITIONAL') ? 'itemsTradisional' : 'itemsModern';
    if(group1 === 'TRADITIONAL'){ s.omzetTradisional += nominal; } else { s.omzetNonTradisional += nominal; }
    if(!s[bucket][barang]) s[bucket][barang] = { omzet:0, notas:new Set(), dates:new Set(), merek: field(r, 'Merek') || '(Tanpa Merek)' };
    const item = s[bucket][barang];
    item.omzet += nominal;
    const nota = field(r, 'Kode Nota', 'KodeNota');
    if(nota) item.notas.add(nota);
    const d = toDate(field(r, 'Tgl'));
    if(d) item.dates.add(d.toISOString().slice(0,10));
    const salesName = normSales(field(r, 'Nama Sales', 'NamaSales'));
    if(salesName) s.salesNames.add(salesName);
  });
  return stores;
}

function fillMissingMTStores(stores, mtList){
  const existingNames = Object.values(stores).map(s=>s.nama.toUpperCase());
  mtList.forEach(mtName=>{
    const already = existingNames.some(n=>n.includes(mtName));
    if(!already){
      stores[mtName] = { nama: mtName, omzetTradisional:0, omzetNonTradisional:0, itemsTradisional:{}, itemsModern:{} };
    }
  });
  return stores;
}

function itemRowsSortedByOmzet(itemMap){
  const names = Object.keys(itemMap).sort((a,b)=>{
    const merekA = itemMap[a].merek || '';
    const merekB = itemMap[b].merek || '';
    if(merekA !== merekB) return merekA.localeCompare(merekB);
    return itemMap[b].omzet - itemMap[a].omzet;
  });
  let lastMerek = null;
  let html = '';
  names.forEach(name=>{
    const item = itemMap[name];
    const datesSorted = Array.from(item.dates).sort().reverse();
    if(item.merek !== lastMerek){
      html += `<tr><td colspan="4" style="text-align:left; background:#e8f0e8; font-weight:bold;">${item.merek}</td></tr>`;
      lastMerek = item.merek;
    }
    html += `<tr><td data-name="${name.toUpperCase()}" style="text-align:left;">${name}</td><td style="text-align:right; white-space:nowrap;">${fmtRp(item.omzet)}</td><td style="text-align:center;">${item.notas.size}</td><td style="text-align:left;">${datesSorted.join(', ')}</td></tr>`;
  });
  return html;
}

  if(!s) return;

function compute(){
  if(currentInsentifMonth === 'Agustus'){ computeAgustus(); return; }
  const salesList = getSalesList();
  const trans5 = {};
  const transTea = {};
  const transMatcha = {};
  const transSwiss = {};
  const schoolDays = {};

  const rangeEa5 = periodRange(PROGRAMS.find(p=>p.id==='ea5').periode);
  const rangeTea = periodRange(PROGRAMS.find(p=>p.id==='nstea').periode);
  const rangeMatcha = periodRange(PROGRAMS.find(p=>p.id==='matcha').periode);
  const rangeSwiss = periodRange('Juli - Agustus');
  const rangeSchool = periodRange('Juli');

  rawData.forEach(r=>{
    const sales = normSales(field(r, 'Nama Sales', 'NamaSales'));
    if(!salesList.includes(sales)) return;
    const toko = field(r, 'Ship To', 'ShipTo') || field(r, 'Perusahaan');
    const barang = field(r, 'Nama Barang', 'NamaBarang');
    const merek = field(r, 'Merek');
    const group1 = field(r, 'Group 1Barang', 'Group1Barang');
    const tgl = field(r, 'Tgl');
    if(!sales || !barang) return;
    const tokoKey = sales + '|' + toko;

    const g5 = itemGroup5(barang, currentBranch);
    if(g5 && inPeriod(tgl, rangeEa5)){ (trans5[tokoKey] = trans5[tokoKey] || new Set()).add(g5); }

    if(isTea(barang, merek) && inPeriod(tgl, rangeTea)){ transTea[tokoKey] = sales; }
    if(isMatcha(barang) && inPeriod(tgl, rangeMatcha)){ transMatcha[tokoKey] = sales; }
    if(isSwiss(barang) && inPeriod(tgl, rangeSwiss)){ transSwiss[tokoKey] = sales; }
    if(isSchool(barang, group1) && inPeriod(tgl, rangeSchool)){
      const d = toDate(tgl);
      let dateStr = d ? d.toISOString().slice(0,10) : String(tgl);
      (schoolDays[sales] = schoolDays[sales] || new Set()).add(dateStr);
    }
  });

  const ea5Count = {}; salesList.forEach(s=>ea5Count[s]=0);
  Object.keys(trans5).forEach(key=>{
    const sales = key.split('|')[0];
    if(trans5[key].size >= 5 && ea5Count[sales] !== undefined) ea5Count[sales]++;
  });

  function countTransactions(transObj){
    const res = {}; salesList.forEach(s=>res[s]=0);
    Object.values(transObj).forEach(sales=>{ if(res[sales] !== undefined) res[sales]++; });
    return res;
  }
  const teaCount = countTransactions(transTea);
  const matchaCount = countTransactions(transMatcha);
  const swissCount = countTransactions(transSwiss);

  const schoolCount = {}; salesList.forEach(s=>schoolCount[s] = schoolDays[s] ? schoolDays[s].size : 0);

  const results = { ea5: ea5Count, nstea: teaCount, matcha: matchaCount, swiss: swissCount };

  const kpiCount = computeKpiMT(salesList);

  render(results, schoolCount, kpiCount);
  document.getElementById('status').textContent = `Selesai menghitung dari ${rawData.length} baris data.`;
}

function computeAgustus(){
  const salesList = getSalesList();
  const transChocolate = {};
  const transChocomalt = {};
  const transSwissRO = {};
  const matchaCtnByNota = {};
  const matchaSalesByNota = {};

  const rangeChocolate = periodRange('Agustus');
  const rangeChocomalt = periodRange('Agustus');
  const rangeSwissRO = periodRange('Juli - Agustus');
  const rangeMatchaDealing = periodRange('Agustus');
  const rangeTsDiabtxMilk = periodRange('Agustus');
  const transTsDiabtxMilk = {};

  rawData.forEach(r=>{
    const sales = resolveAgustusSales(field(r, 'Nama Sales', 'NamaSales'), field(r, 'Tgl'));
    if(!salesList.includes(sales)) return;
    const toko = field(r, 'Ship To', 'ShipTo') || field(r, 'Perusahaan');
    const barang = field(r, 'Nama Barang', 'NamaBarang');
    const tgl = field(r, 'Tgl');
    const nota = field(r, 'Kode Nota', 'KodeNota');
    if(!sales || !barang) return;
    const tokoKey = sales + '|' + toko;

    if(isHiloChocolate(barang) && inPeriod(tgl, rangeChocolate)){ transChocolate[tokoKey] = sales; }
    if(isHiloChocomalt(barang) && inPeriod(tgl, rangeChocomalt)){ transChocomalt[tokoKey] = sales; }
    if(isSwiss(barang) && inPeriod(tgl, rangeSwissRO)){ transSwissRO[tokoKey] = sales; }
    if(isTsDiabtxMilk(barang) && inPeriod(tgl, rangeTsDiabtxMilk)){ transTsDiabtxMilk[tokoKey] = sales; }
    if(isMatcha(barang) && inPeriod(tgl, rangeMatchaDealing)){
      const ctn = toCtnQty(field(r, 'Jml'), field(r, 'Satuan'));
      const notaKey = sales + '|' + nota;
      matchaCtnByNota[notaKey] = (matchaCtnByNota[notaKey] || 0) + ctn;
      matchaSalesByNota[notaKey] = sales;
    }
  });

  const matchaCtn = {}; salesList.forEach(s=>matchaCtn[s]=0);
  const matchaNominal = {}; salesList.forEach(s=>matchaNominal[s]=0);
  const matchaTierCounts = {}; salesList.forEach(s=>matchaTierCounts[s]={3:0,5:0,10:0});
  Object.keys(matchaCtnByNota).forEach(notaKey=>{
    const sales = matchaSalesByNota[notaKey];
    const ctn = matchaCtnByNota[notaKey];
    if(matchaCtn[sales] === undefined) return;
    matchaCtn[sales] += ctn;
    const nominal = matchaDealingNominal(ctn);
    matchaNominal[sales] += nominal;
    if(ctn >= 10) matchaTierCounts[sales][10]++;
    else if(ctn >= 5) matchaTierCounts[sales][5]++;
    else if(ctn >= 3) matchaTierCounts[sales][3]++;
  });

  function countTransactions(transObj){
    const res = {}; salesList.forEach(s=>res[s]=0);
    Object.values(transObj).forEach(sales=>{ if(res[sales] !== undefined) res[sales]++; });
    return res;
  }
  const chocolateCount = countTransactions(transChocolate);
  const chocomaltCount = countTransactions(transChocomalt);
  const swissROCount = countTransactions(transSwissRO);
  const tsDiabtxMilkCount = countTransactions(transTsDiabtxMilk);

  const results = { hiloChocolate: chocolateCount, hiloChocomalt: chocomaltCount, swissRO: swissROCount, tsDiabtxMilk: tsDiabtxMilkCount };

  const kpiCount = computeKpiMT(salesList);

  renderAgustus(results, matchaCtn, matchaNominal, matchaTierCounts, kpiCount);
  document.getElementById('status').textContent = `Selesai menghitung dari ${rawData.length} baris data.`;
}

function computeKpiMT(salesList){
  const transKPI = {};
  const rangeKpiMT = periodRange(KPI_MT.periode);

  rawData.forEach(r=>{
    const sales = normSales(field(r, 'Nama Sales', 'NamaSales'));
    if(!salesList.includes(sales)) return;
    const toko = field(r, 'Ship To', 'ShipTo') || field(r, 'Perusahaan');
    const barang = field(r, 'Nama Barang', 'NamaBarang');
    const tgl = field(r, 'Tgl');
    if(!sales || !barang) return;
    const tokoKey = sales + '|' + toko;

    const gKpi = itemGroupKPI(barang);
    if(gKpi && inPeriod(tgl, rangeKpiMT)){ (transKPI[tokoKey] = transKPI[tokoKey] || new Set()).add(gKpi); }
  });

  const kpiCount = {}; salesList.forEach(s=>kpiCount[s]=0);
  Object.keys(transKPI).forEach(key=>{
    const sales = key.split('|')[0];
    if(transKPI[key].size >= 5 && kpiCount[sales] !== undefined) kpiCount[sales]++;
  });
  return kpiCount;
}

function pct(ach, target){
  if(!target) return 0;
  return Math.round((ach/target)*100);
}

function parseInsentifAmount(str){
  if(!str) return 0;
  const m = String(str).match(/[\d.,]+/);
  if(!m) return 0;
  return parseInt(m[0].replace(/[.,]/g, ''), 10) || 0;
}

function switchInsentifMonth(month){
  document.getElementById('btn-month-Juli').classList.toggle('branch-active', month === 'Juli');
  document.getElementById('btn-month-Agustus').classList.toggle('branch-active', month === 'Agustus');

  if(currentMode === 'dashboard'){
    currentDashboardMonth = month;
    if(currentBranch === 'TokoMT') showTokoMTDashboard();
    else if(currentBranch === 'BSP') showBSPDashboard();
    else loadDashboardBranch(currentBranch);
    return;
  }

  currentInsentifMonth = month;
  if(currentBranch === 'KOMPETISI'){ computeKompetisi(); return; }
  if(rawData.length) compute();
  else if(month === 'Agustus') renderAgustus({}, {}, {}, {}, {});
  else render({ea5:{},nstea:{},matcha:{},swiss:{}}, {}, {});
}

function switchBranch(branch){
  currentBranch = branch;
  ['Makassar','Bulukumba','Gorontalo','KOMPETISI'].forEach(b=>{
    const btn = document.getElementById('btn-' + b);
    if(btn) btn.classList.toggle('branch-active', b === branch);
  });
  const btnMT = document.getElementById('btn-tokoMT');
  if(btnMT) btnMT.classList.remove('branch-active');
  const btnBSP = document.getElementById('btn-BSP');
  if(btnBSP) btnBSP.classList.remove('branch-active');
  document.getElementById('bspUploadRow').classList.add('hidden');
  if(currentMode === 'dashboard'){
    loadDashboardBranch(branch);
    return;
  }
  const monthRow = document.getElementById('monthToggleRow');
  if(branch === 'KOMPETISI'){
    if(monthRow) monthRow.classList.add('hidden');
    computeKompetisi();
    return;
  }
  if(monthRow) monthRow.classList.remove('hidden');
  if(rawData.length) compute();
  else if(currentInsentifMonth === 'Agustus') renderAgustus({}, {}, {}, {}, {});
  else render({ea5:{},nstea:{},matcha:{},swiss:{}}, {}, {});
}

function computeKompetisi(){
  const salesList = getSalesList().filter(s => s !== 'KAMELIA (NFI)');
  const table = document.getElementById('mainTable');
  if(!rawData.length){
    table.innerHTML = '<caption>Kompetisi</caption>';
    const thead = table.insertRow(-1);
    thead.innerHTML = '<th>Nama Salesman</th>';
    salesList.forEach(sales=>{
      const row = table.insertRow(-1);
      row.innerHTML = `<td class="nama">${sales}</td>`;
    });
    return;
  }

  const range = periodRange('Agustus - September');
  const today = new Date();

  let latestDataDate = null;
  rawData.forEach(r=>{
    const sales = resolveAgustusSales(field(r, 'Nama Sales', 'NamaSales'), field(r, 'Tgl'));
    if(!salesList.includes(sales)) return;
    const d = toDate(field(r, 'Tgl'));
    if(d && d >= range[0] && d <= range[1] && (!latestDataDate || d > latestDataDate)) latestDataDate = d;
  });

  let daysElapsed;
  const octStart = new Date(2026, 9, 1);
  const sepStart = new Date(2026, 8, 1);
  const augStart = new Date(2026, 7, 1);
  if(today >= octStart){
    daysElapsed = 50;
  } else if(today >= sepStart){
    const wd = countKompetisiWorkdays(sepStart, latestDataDate || sepStart);
    daysElapsed = 24 + Math.max(0, wd - 2);
  } else {
    const wd = countKompetisiWorkdays(augStart, latestDataDate || augStart);
    daysElapsed = Math.max(1, wd - 2);
  }

  const hiloNota = {}, matchaNota = {}, nsToko = {};
  salesList.forEach(s=>{ hiloNota[s] = new Set(); matchaNota[s] = new Set(); nsToko[s] = {}; });

  rawData.forEach(r=>{
    const sales = resolveAgustusSales(field(r, 'Nama Sales', 'NamaSales'), field(r, 'Tgl'));
    if(!salesList.includes(sales)) return;
    const toko = field(r, 'Ship To', 'ShipTo') || field(r, 'Perusahaan');
    const barang = field(r, 'Nama Barang', 'NamaBarang');
    const tgl = field(r, 'Tgl');
    const nota = field(r, 'Kode Nota', 'KodeNota');
    if(!sales || !barang) return;
    if(!inPeriod(tgl, range)) return;

    if(isHiloEC(barang) && !isBonusRow(r)) hiloNota[sales].add(sales + '|' + nota + '|' + tgl);
    if(isMatcha(barang) && !isBonusRow(r)) matchaNota[sales].add(sales + '|' + nota + '|' + tgl);

    const branch = branchOfSales(sales);
    const g = itemGroupKompetisi(barang, branch);
    if(g){
      const tokoKey = sales + '|' + toko;
      if(!nsToko[sales][tokoKey]) nsToko[sales][tokoKey] = new Set();
      nsToko[sales][tokoKey].add(g);
    }
  });

  const rows = salesList.map(sales=>{
    const branch = branchOfSales(sales);
    const threshold = KOMPETISI_VARIAN_THRESHOLD[branch] || 6;
    // Gorontalo: item Matcha baru masuk (mulai jual 9 Agustus), pembagi EC/Day Matcha dikurangi 5 hari
    const daysElapsedMatcha = branch === 'Gorontalo' ? Math.max(1, daysElapsed - 5) : daysElapsed;
    const ecHilo = hiloNota[sales].size / daysElapsed;
    const ecMatcha = matchaNota[sales].size / daysElapsedMatcha;
    const poinHilo = ecDayPoinHilo(ecHilo);
    const poinMatcha = ecDayPoinMatcha(ecMatcha);
    const eaNs = Object.values(nsToko[sales]).filter(set=>set.size >= threshold).length;
    const pctNs = (eaNs / KOMPETISI_TARGET_TOKO) * 100;
    const poinNs = pctNs;
    const totalPoin = (poinHilo + poinMatcha + poinNs) / 2;
    const insentif = totalPoin >= 70 ? 1000000 : null;
    return { sales, branch, ecHilo, poinHilo, ecMatcha, poinMatcha, eaNs, pctNs, poinNs, totalPoin, insentif };
  });

  renderKompetisi(rows);
  document.getElementById('status').textContent = `Selesai menghitung dari ${rawData.length} baris data.`;
}

function poinColorStyle(val, max){
  const ratio = Math.max(0, Math.min(1, val / max));
  let r, g;
  if(ratio < 0.5){ r = 255; g = Math.round(255 * (ratio / 0.5)); }
  else { r = Math.round(255 * (1 - (ratio - 0.5) / 0.5)); g = 255; }
  return `background-color: rgb(${r},${g},120); font-weight:bold;`;
}
function renderKompetisi(rows){
  const table = document.getElementById('mainTable');
  table.innerHTML = '<caption>Kompetisi</caption>';
  const thead = table.insertRow(-1);
  thead.innerHTML = '<th>Nama Salesman</th><th>EC/Day HiLo</th><th>Poin HiLo</th><th>EC/Day Matcha</th><th>Poin Matcha</th><th>EA NS (Toko)</th><th>%Ach NS</th><th>Poin NS</th><th>Total Poin</th><th>Insentif</th>';

  rows.forEach(r=>{
    const row = table.insertRow(-1);
    row.innerHTML = `<td class="nama">${r.sales}</td>`
      + `<td>${r.ecHilo.toFixed(2)}</td><td style="${poinColorStyle(r.poinHilo, 50)}">${r.poinHilo}</td>`
      + `<td>${r.ecMatcha.toFixed(2)}</td><td style="${poinColorStyle(r.poinMatcha, 50)}">${r.poinMatcha}</td>`
      + `<td>${r.eaNs}</td><td>${r.pctNs.toFixed(0)}%</td><td style="${poinColorStyle(r.poinNs, 100)}">${r.poinNs.toFixed(0)}</td>`
      + `<td style="${poinColorStyle(r.totalPoin, 100)}">${r.totalPoin.toFixed(1)}</td>`
      + `<td>${r.insentif ? 'Rp ' + r.insentif.toLocaleString('id-ID') : '-'}</td>`;
  });

  const avgTotal = rows.reduce((a,r)=>a+r.totalPoin,0) / rows.length;
  const sumRow = table.insertRow(-1);
  sumRow.innerHTML = `<td class="program" colspan="8">Rata-rata Poin (${rows.length} sales)</td><td><b>${avgTotal.toFixed(1)}</b></td><td></td>`;
}

function updateTarget(id, val){
  const p = PROGRAMS.find(p=>p.id===id) || AGUSTUS_PROGRAMS.find(p=>p.id===id);
  if(p){
    const num = parseInt(val) || 0;
    if(p.targetByBranch && p.targetByBranch[currentBranch] !== undefined){
      p.targetByBranch[currentBranch] = num;
    } else {
      p.target = num;
    }
  }
  if(rawData.length) compute();
}

function exportToExcel(){
  if(!rawData.length){
    alert('Belum ada data untuk diexport. Pilih cabang yang datanya sudah ada, atau upload file dulu.');
    return;
  }
  const exportRows = rawData.map(r=>{
    const d = toDate(r['Tgl']);
    return Object.assign({}, r, { 'Tgl': d || r['Tgl'] });
  });
  const ws = XLSX.utils.json_to_sheet(exportRows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data Mentah');
  const tanggal = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Data_Insentif_${currentUser || currentBranch}_${tanggal}.xlsx`);
}
